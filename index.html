<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>過去問振り返り管理</title>
    <meta
      name="description"
      content="大学入試の過去問での失点、思考プロセス、次回対策をカードと大学ボードで整理する個人用Webサイト。"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app"></main>
    <template id="record-card-template">
      <article class="record-card">
        <button class="card-open" type="button">
          <span class="color-bar"></span>
          <span class="board-dot"></span>
          <strong class="university"></strong>
          <span class="faculty"></span>
          <span class="card-meta"></span>
          <span class="question-code"></span>
          <span class="status"></span>
        </button>
        <div class="reason-list"></div>
        <div class="tag-list compact"></div>
        <button class="toggle-review" type="button"></button>
      </article>
    </template>
    <script src="./app.js"></script>
  </body>
</html>
